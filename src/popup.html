<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>日语汉字 AI 读音助手</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <div class="locale-toolbar">
        <label class="ui-language-control" for="ui-language">
          <span data-i18n="popup.uiLanguage.label">界面语言</span>
          <select id="ui-language" aria-label="选择弹窗界面语言" title="选择弹窗界面语言" disabled aria-busy="true">
            <option value="zh-CN">中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
          </select>
        </label>
      </div>
      <p id="ui-language-status" class="locale-status" role="status" aria-live="polite"></p>
      <img class="brand" src="icons/icon-48.png" alt="">
      <h1 data-i18n="popup.title">日语汉字读音助手</h1>
      <p id="status" class="status" role="status" aria-live="polite">正在检查当前页面…</p>
      <button id="toggle" type="button" disabled aria-busy="true">启用当前页读音与划词翻译</button>
      <section class="translation-card" aria-labelledby="translation-heading">
        <div>
          <h2 id="translation-heading" data-i18n="popup.translation.heading">划词翻译</h2>
          <p id="translation-status" role="status" aria-live="polite">正在检查翻译配置…</p>
        </div>
        <span id="translation-badge" class="badge">检查中</span>
      </section>
      <button id="open-options" class="secondary" type="button" disabled aria-busy="true">打开翻译管理面板</button>
      <p class="privacy" data-i18n="popup.privacy">读音始终在本地处理；只有主动选中的文本会发送到你配置的接口</p>
    </main>
    <script src="options-i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
